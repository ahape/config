# req v3.5+

# Prefix: C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# Vi-style keys in copy mode
setw -g mode-keys vi

# Shell
set -g default-command "/bin/zsh"

# Truecolor / terminal capabilities
set -as terminal-features ",xterm-256color:RGB"
set -g default-terminal "tmux-256color"

# Enhanced modified-key support
set -g extended-keys on #; Turn this off once v3.6 is installed?

# Allow terminal escape-sequence passthrough
set -g allow-passthrough on

# Neovim / terminal responsiveness
set -sg escape-time 10
set -g focus-events on

# TUI apps (and tmux scrollback) get mouse events
set -g mouse on

# Keep the selection highlighted after release instead of leaving copy mode
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear

# Uncomment the block for this machine's OS.

# macOS (Terminal.app)
# Terminal.app ignores OSC 52 clipboard writes, so pipe copies to pbcopy
# set -s copy-command 'pbcopy'
# set -g extended-keys-format csi-u

# WSL (Windows Terminal)
# Windows Terminal honors OSC 52; "on" also lets apps like Neovim set it
# set -g set-clipboard on
